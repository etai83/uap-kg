{% extends "base.html" %}
{% block title %}Event Timeline{% endblock %}
{% block main %}
<header class="hidden md:flex justify-between items-center w-full px-margin-desktop h-20 sticky top-0 z-30 bg-background/80 backdrop-blur-md border-b border-outline-variant/20">
  <div>
    <h1 class="font-display-lg text-display-lg text-on-surface">Event Timeline</h1>
    <p class="font-mono-data text-mono-data text-on-surface-variant mt-1">Chronological index of world happenings — not upload dates.</p>
  </div>
  <div class="relative">
    <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
    <input id="tl-search" class="bg-surface-container-lowest border border-outline-variant/50 rounded-DEFAULT py-2 pl-10 pr-4 font-mono-data text-mono-data text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary outline-none w-64" placeholder="Search chronology..." type="search"/>
  </div>
</header>
<div class="p-margin-mobile md:p-margin-desktop flex-1 max-w-container-max mx-auto w-full flex flex-col gap-8">
  <section class="grid grid-cols-1 md:grid-cols-12 gap-gutter">
    <div class="col-span-1 md:col-span-8 bg-surface-container-low border border-outline-variant/30 rounded-lg p-6">
      <h2 class="font-headline-sm text-headline-sm text-primary mb-4 flex items-center gap-2">
        <span class="material-symbols-outlined text-[20px]">tune</span> Extraction Parameters
      </h2>
      <div class="flex flex-wrap gap-4">
        <div class="flex flex-col gap-1">
          <label class="font-label-caps text-label-caps text-on-surface-variant">Thematic Topic</label>
          <select id="tl-topic" class="bg-surface border border-outline-variant/50 rounded-DEFAULT px-3 py-2 font-mono-data text-mono-data text-on-surface outline-none">
            <option value="">All Vectors</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="font-label-caps text-label-caps text-on-surface-variant">Identity state</label>
          <div class="flex bg-surface border border-outline-variant/50 rounded-DEFAULT overflow-hidden" id="tl-status">
            <button type="button" data-status="" class="px-4 py-2 font-mono-data text-mono-data bg-surface-variant/50 text-primary border-r border-outline-variant/50">All</button>
            <button type="button" data-status="consensus" class="px-4 py-2 font-mono-data text-mono-data text-on-surface-variant hover:bg-surface-variant/30 border-r border-outline-variant/50">Consensus</button>
            <button type="button" data-status="conflict" class="px-4 py-2 font-mono-data text-mono-data text-on-surface-variant hover:bg-surface-variant/30 border-r border-outline-variant/50">Conflict</button>
            <button type="button" data-status="provisional" class="px-4 py-2 font-mono-data text-mono-data text-on-surface-variant hover:bg-surface-variant/30">Provisional</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-span-1 md:col-span-4 bg-surface-container-highest border border-outline-variant/20 rounded-lg p-6 relative overflow-hidden">
      <div class="font-mono-data text-mono-data text-on-surface-variant mb-1">Indexed Events</div>
      <div id="tl-count" class="font-display-lg text-display-lg text-primary">—</div>
      <div class="flex items-center gap-2 mt-2">
        <span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
        <span class="font-label-caps text-label-caps text-on-surface-variant">Seed + local store</span>
      </div>
    </div>
  </section>
  <section class="relative">
    <div class="absolute left-[27px] md:left-[35px] top-4 bottom-0 w-[1px] bg-outline-variant/30 z-0"></div>
    <div id="tl-feed" class="flex flex-col gap-6 relative z-10"></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>Aetheris.pageTimeline();</script>
{% endblock %}
