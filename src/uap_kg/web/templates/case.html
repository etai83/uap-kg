{% extends "base.html" %}
{% block title %}Borland case{% endblock %}
{% block main %}
<style>
  main { height: 100vh; max-height: 100vh; overflow: hidden; }
  @media (max-width: 1023px) {
    main { height: auto; max-height: none; overflow: auto; }
    #case-scroll { height: 62vh; min-height: 320px; flex: none; }
  }
</style>
<header class="flex flex-wrap justify-between items-center gap-3 w-full px-4 md:px-8 h-auto min-h-16 py-3 bg-surface/95 backdrop-blur-md border-b border-outline-variant/20 shrink-0">
  <div>
    <div class="font-label-caps text-label-caps text-primary">Case test</div>
    <h2 id="case-title" class="font-headline-sm text-headline-sm">Dylan Borland</h2>
  </div>
  <p id="case-note" class="font-body-sm text-body-sm text-on-surface-variant max-w-xl"></p>
  <div class="flex items-center gap-3">
    <nav class="flex items-center gap-2" aria-label="Graph display">
      <a id="case-engine-columns" href="/case/borland" class="font-label-caps text-label-caps px-3 py-1 border border-primary text-primary">Columns</a>
      <a id="case-engine-sigma" href="/case/borland/sigma" class="font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant">3D</a>
    </nav>
    <a id="case-video" class="font-mono-data text-mono-data text-primary" href="https://www.youtube.com/watch?v=K4gYHs84BIc" target="_blank" rel="noreferrer">K4gYHs84BIc</a>
  </div>
</header>
<div class="flex flex-wrap gap-2 px-4 md:px-8 py-3 border-b border-outline-variant/20">
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-primary text-primary" data-type="all">All</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="claim">Claims</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="named_person">Named person</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="uap_item">UAP item</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="location">Location</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="date_time">Date and time</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="organization">Organization</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="project">Project</button>
  <button type="button" class="case-filter font-label-caps text-label-caps px-3 py-1 border border-outline-variant/40 text-on-surface-variant" data-type="object">Object</button>
  <input id="case-search" class="ml-auto bg-surface-container border border-outline-variant/30 text-on-surface font-mono-data text-mono-data rounded px-3 py-1 w-full sm:w-56" placeholder="Find a claim or entity"/>
  <span class="font-mono-data text-[11px] text-on-surface-variant">Cyan line: about. Pale line: elaborates. Coral line: contradicts.</span>
</div>
<div class="flex-1 flex flex-col lg:flex-row min-h-0">
  <div id="case-scroll" class="flex-1 overflow-auto relative bg-surface-container-lowest">
    <svg id="case-svg" class="absolute top-0 left-0 pointer-events-none"></svg>
    <div id="case-nodes" class="relative"></div>
  </div>
  <aside id="case-inspect" class="w-full lg:w-96 border-t lg:border-t-0 lg:border-l border-outline-variant/20 bg-surface-container p-5 overflow-y-auto max-h-[46vh] lg:max-h-none">
    <div class="font-label-caps text-label-caps text-on-surface-variant mb-2">Inspector</div>
    <div id="case-inspect-body" class="font-body-sm text-body-sm text-on-surface-variant">Select a claim or an entity.</div>
  </aside>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/case.js?v=20261003n"></script>
{% endblock %}
