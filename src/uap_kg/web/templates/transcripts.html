{% extends "base.html" %}
{% block title %}Transcripts{% endblock %}
{% block main %}
<div class="flex flex-1 overflow-hidden min-h-[calc(100vh-4rem)] md:min-h-screen">
  <aside class="hidden lg:flex w-80 shrink-0 flex-col bg-surface-container-lowest border-r ghost-border">
    <div class="p-5 border-b ghost-border">
      <div class="font-label-caps text-label-caps tracking-widest uppercase text-on-surface-variant">Source speech</div>
      <h1 class="font-headline-md text-headline-md text-on-surface mt-2">Transcripts</h1>
      <p class="font-mono-data text-mono-data text-on-surface-variant mt-1" id="tx-count">—</p>
      <input id="tx-filter" class="mt-3 w-full bg-surface-container-lowest border border-outline-variant/40 rounded px-2 py-1.5 font-mono-data text-mono-data" placeholder="Filter videos…"/>
    </div>
    <div id="tx-list" class="flex-1 overflow-y-auto p-3 space-y-1"></div>
  </aside>
  <div class="flex-1 flex flex-col min-w-0">
    <header class="shrink-0 border-b ghost-border bg-surface-container/50 flex flex-col lg:flex-row lg:items-center gap-2 px-4 md:px-6 py-3">
      <select id="tx-video" class="lg:hidden w-full bg-surface-container-lowest border border-outline-variant/40 rounded px-2 py-1.5 font-mono-data text-mono-data text-on-surface"></select>
      <div class="hidden lg:block min-w-0 flex-1">
        <div id="tx-title" class="font-headline-sm text-headline-sm text-on-surface truncate">—</div>
        <div id="tx-meta" class="font-mono-data text-[11px] text-on-surface-variant truncate"></div>
      </div>
      <div class="flex items-center gap-2 min-w-0">
        <input id="tx-find" class="flex-1 min-w-0 lg:flex-none lg:w-40 bg-surface-container-lowest border border-outline-variant/40 rounded px-2 py-1 font-mono-data text-mono-data" placeholder="Find…"/>
        <a id="tx-review" class="font-mono-data text-[11px] text-primary underline decoration-dotted whitespace-nowrap" href="/review">Review</a>
        <a id="tx-yt" class="font-mono-data text-[11px] text-primary underline decoration-dotted whitespace-nowrap" href="#" target="_blank" rel="noreferrer">YouTube</a>
      </div>
    </header>
    <div id="tx-spans" class="flex-1 overflow-y-auto p-4 md:p-6 space-y-4"></div>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>Aetheris.pageTranscripts({{ video_id|tojson }});</script>
{% endblock %}
