{% extends "base.html" %}
{% block title %}Ingest &amp; Review{% endblock %}
{% block main %}
<header class="hidden md:flex justify-between items-center w-full px-margin-desktop h-16 sticky top-0 z-30 bg-surface/95 backdrop-blur-md border-b border-outline-variant/20">
  <div class="flex items-center gap-6">
    <span class="font-headline-md text-headline-md font-bold text-primary tracking-tighter">Aetheris Intel</span>
    <div class="flex items-center gap-4 font-mono-data text-mono-data text-on-surface-variant pl-6 border-l ghost-divider">
      <div>
        <div class="text-on-surface-variant/70">ASSET</div>
        <div id="rv-asset" class="text-on-surface">—</div>
      </div>
      <select id="rv-video" class="bg-surface-container-lowest border border-outline-variant/40 rounded-DEFAULT px-2 py-1 text-on-surface"></select>
    </div>
  </div>
</header>
<div class="p-gutter w-full flex-1 flex gap-gutter overflow-hidden h-[calc(100vh-4rem)]">
  <section class="flex-1 flex flex-col bg-surface-container-low border border-outline-variant/30 rounded min-w-0">
    <div class="p-4 border-b border-outline-variant/30 flex justify-between items-center bg-surface-container">
      <h2 class="font-headline-sm text-headline-sm flex items-center gap-2">
        <span class="material-symbols-outlined text-primary-fixed-dim">notes</span> Source Transcript
      </h2>
      <input id="rv-find" class="bg-surface-container-lowest border border-outline-variant/40 rounded px-2 py-1 font-mono-data text-mono-data w-40" placeholder="Find…"/>
    </div>
    <div id="rv-spans" class="flex-1 overflow-y-auto p-6 space-y-4"></div>
  </section>
  <section class="w-full md:w-[420px] flex-shrink-0 flex flex-col bg-surface-container-lowest border border-outline-variant/30 rounded">
    <div class="p-4 border-b border-outline-variant/30 bg-surface-container flex justify-between items-center gap-3">
      <h2 class="font-headline-sm text-headline-sm flex items-center gap-2 min-w-0 truncate">
        <span class="material-symbols-outlined text-primary shrink-0">save_as</span>
        <span class="truncate">Proposed Claims</span>
      </h2>
      <div class="flex items-stretch shrink-0 rounded overflow-hidden border border-outline-variant/40">
        <div id="rv-pending" class="font-mono-data text-mono-data text-[11px] bg-surface-variant px-2.5 py-1.5 flex items-center">0 PENDING</div>
        <button type="button" id="rv-approve-all" class="hidden bg-primary/10 hover:bg-primary/20 text-primary font-label-caps text-[10px] px-2.5 py-1.5 border-l border-outline-variant/40">Approve all</button>
      </div>
    </div>
    <div id="rv-claims" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  </section>
</div>
{% endblock %}
{% block scripts %}
<script>Aetheris.pageReview({{ video_id|tojson }});</script>
{% endblock %}
