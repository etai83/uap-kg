{% extends "base.html" %}
{% block title %}Knowledge Graph{% endblock %}
{% block main %}
<header class="flex justify-between items-center w-full px-margin-desktop h-16 bg-surface/95 backdrop-blur-md border-b border-outline-variant/20 shrink-0">
  <div class="flex items-center gap-4">
    <img alt="" class="w-8 h-8 rounded object-cover border border-outline-variant/30" src="/static/img/insignia-cyan.jpg"/>
    <h2 class="font-headline-sm text-headline-sm">Knowledge Graph</h2>
    <span id="g-focus" class="font-mono-data text-mono-data text-primary">ENTITY: —</span>
  </div>
  <div class="flex items-center gap-3">
    <input id="g-search" class="bg-surface-container border border-outline-variant/30 text-on-surface font-mono-data text-mono-data rounded pl-3 pr-4 py-1.5 w-64" placeholder="Query node…"/>
    <img alt="Curator" class="w-8 h-8 rounded-full object-cover border border-outline-variant/30" src="/static/img/avatar-archivist.jpg"/>
  </div>
</header>
<div class="flex-1 relative overflow-hidden flex">
  <svg class="absolute inset-0 w-full h-full z-0 pointer-events-none" id="g-svg"></svg>
  <div id="g-canvas" class="relative flex-1 overflow-auto p-10 z-10"></div>
  <aside id="g-inspect" class="w-80 border-l ghost-border bg-surface-container-lowest p-5 overflow-y-auto hidden md:block">
    <div class="font-label-caps text-label-caps text-on-surface-variant mb-2">Inspector</div>
    <div id="g-inspect-body" class="font-body-sm text-body-sm text-on-surface-variant">Select a node.</div>
  </aside>
</div>
{% endblock %}
{% block scripts %}
<script>Aetheris.pageGraph();</script>
{% endblock %}
